<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Card Exclusiva - Origen</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --bg-radial: #2a2a2a;
            --gold-primary: #d4af37;
            --gold-light: #f9df9f;
            --gold-dark: #8a6519;
            --env-color: #1c1c1c;
            --card-bg: #0a0a0a;
            --text-main: #fdfbf7;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, var(--bg-radial) 0%, var(--bg-dark) 100%); 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
            color: var(--text-main);
        }

        /* Contenedor general */
        .wrapper {
            position: relative; width: 400px; height: 250px; 
            display: flex; justify-content: center; align-items: center;
        }

        /* ================= SOBRE ================= */
        .envelope-container {
            position: absolute; width: 400px; height: 250px; 
            cursor: pointer; z-index: 20;
            transition: transform 0.6s ease, opacity 0.5s ease;
            filter: drop-shadow(0 25px 40px rgba(0,0,0,0.9));
        }

        .envelope-container:hover { transform: translateY(-5px); }

        .back, .front-left, .front-right, .front-bottom, .flap { position: absolute; top:0; left:0; width:100%; height:100%; }
        .back { background: #111; z-index: 1; border-radius: 4px; }
        .front-left { background: var(--env-color); clip-path: polygon(0 0, 0 100%, 100% 50%); z-index: 3; }
        .front-right { background: var(--env-color); clip-path: polygon(100% 0, 100% 100%, 0 50%); z-index: 3; }
        .front-bottom { background: #151515; clip-path: polygon(0 100%, 100% 100%, 50% 50%); z-index: 4; }
        
        .flap { transform-origin: top center; transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); z-index: 5; }
        .flap-shape { width: 100%; height: 100%; background: var(--env-color); clip-path: polygon(0 0, 100% 0, 50% 50%); }
        
        .seal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 65px; height: 65px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border: 2px solid var(--gold-light); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Playfair Display', serif; font-weight: 700; font-size: 15px; color: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); z-index: 6;
        }

        .hint {
            position: absolute; bottom: -45px; left: 0; width: 100%;
            text-align: center; font-size: 11px; letter-spacing: 3px; color: var(--gold-primary);
            text-transform: uppercase; animation: pulse 2s infinite; pointer-events: none;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* ================= TARJETA VIP ================= */
        .gift-card {
            position: absolute; width: 360px;
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.6); border-radius: 6px;
            padding: 25px 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
            z-index: 10; opacity: 0; pointer-events: none;
            transform: scale(0.8) translateY(30px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(212, 175, 55, 0.05);
        }

        .gift-card.revealed { opacity: 1; transform: scale(1.05) translateY(0); pointer-events: auto; }

        .brand-header { text-align: center; margin-bottom: 12px; width: 100%; }
        .logo-img { height: 45px; width: auto; margin-bottom: 8px; }
        .subtitle { font-size: 10px; color: var(--gold-primary); text-transform: uppercase; letter-spacing: 4px; font-weight: 600;}
        .divider { width: 40px; height: 2px; background: var(--gold-primary); margin: 0 auto 15px auto; opacity: 0.8; }
        .hero-message { font-family: 'Playfair Display', serif; font-style: italic; font-size: 14px; color: #ccc; text-align: center; margin-bottom: 20px; line-height: 1.4; }

        /* Grilla de Datos */
        .data-grid {
            width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 4px; padding: 15px; margin-bottom: 20px;
        }

        .data-item { display: flex; flex-direction: column; align-items: flex-start; }
        .data-item.center { align-items: center; text-align: center; grid-column: 1 / -1; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }
        
        .data-label { font-size: 8px; color: var(--gold-primary); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
        .data-value { font-size: 13px; font-weight: 600; color: var(--text-main); font-family: 'Playfair Display', serif; }
        
        .gift-value { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: var(--gold-light); text-align: center; margin-top: 5px; letter-spacing: 1px; }

        /* Botón de WhatsApp */
        .btn-redeem {
            width: 100%; background: var(--gold-primary); color: var(--bg-dark);
            border: none; padding: 14px 0; font-family: 'Montserrat', sans-serif;
            font-size: 11px; font-weight: 700; letter-spacing: 2px; border-radius: 4px;
            cursor: pointer; transition: all 0.3s ease; text-transform: uppercase;
        }
        .btn-redeem:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); }

        /* Animación de partículas */
        .particle { position: absolute; background: var(--gold-light); border-radius: 50%; pointer-events: none; opacity: 0; z-index: 15; }

        /* Ajustes Móviles */
        @media (max-width: 480px) {
            .wrapper { transform: scale(0.85); }
            /* Centrado absoluto para móviles cuando se revela */
            .gift-card.revealed { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); width: 90%; max-width: 360px; }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="scene">
        
        <!-- EL SOBRE -->
        <div class="envelope-container" id="envelope">
            <div class="back"></div>
            <div class="front-left"></div>
            <div class="front-right"></div>
            <div class="front-bottom"></div>
            <div class="flap" id="flap">
                <div class="flap-shape"></div>
                <div class="seal">REGALO</div>
            </div>
            <div class="hint" id="hint">Toca para abrir tu regalo</div>
        </div>

        <!-- LA TARJETA -->
        <div class="gift-card" id="giftCard">
            <div class="brand-header">
                <div class="subtitle">Tarjeta de Regalo</div>
                <img src="Origen logov2.png" alt="Origen" class="logo-img" onerror="this.src='https://placehold.co/150x45/0a0a0a/d4af37?text=ORIGEN'">
            </div>
            
            <div class="divider"></div>
            <div class="hero-message">"Un viaje en el tiempo donde la cultura se sienta en tu mesa."</div>

            <div class="data-grid">
                <div class="data-item">
                    <span class="data-label">Para</span>
                    <span class="data-value" id="field-para">Afortunado/a</span>
                </div>
                <div class="data-item">
                    <span class="data-label">De parte de</span>
                    <span class="data-value" id="field-de">Alguien Especial</span>
                </div>
                <div class="data-item center">
                    <span class="data-label">Experiencia Obsequiada</span>
                    <div class="gift-value" id="field-obsequio">MVD Bohemia</div>
                </div>
            </div>

            <button class="btn-redeem" id="btnRedeem">COORDINAR RESERVA</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. CAPTURAR DATOS DE LA URL
            const urlParams = new URLSearchParams(window.location.search);
            const paramPara = urlParams.get('para');
            const paramDe = urlParams.get('de');
            const paramObsequio = urlParams.get('obsequio');
            
            // TELÉFONO DE TU RESTAURANTE (Con código de país, sin el +, por ejemplo 59899123456)
            const numeroRestaurante = '59895377960'; // <-- CAMBIA ESTO POR TU NÚMERO

            // Si hay datos en la URL, los escribe en la tarjeta
            if (paramPara) document.getElementById('field-para').textContent = paramPara;
            if (paramDe) document.getElementById('field-de').textContent = paramDe;
            if (paramObsequio) document.getElementById('field-obsequio').textContent = paramObsequio;

            // 2. CONFIGURAR BOTÓN WHATSAPP
            const btnRedeem = document.getElementById('btnRedeem');
            btnRedeem.addEventListener('click', () => {
                const nombrePara = paramPara || 'mí';
                const nombreDe = paramDe ? ` enviada por ${paramDe}` : '';
                const regalo = paramObsequio || 'una experiencia gastronómica';
                
                const mensaje = `Hola Origen! Tengo una Tarjeta de Regalo a nombre de ${nombrePara}${nombreDe}. Me gustaría coordinar una reserva para disfrutar de: ${regalo}.`;
                
                const whatsappUrl = `https://wa.me/${numeroRestaurante}?text=${encodeURIComponent(mensaje)}`;
                window.open(whatsappUrl, '_blank');
            });

            // 3. ANIMACIÓN Y LÓGICA DEL SOBRE
            const envelope = document.getElementById('envelope');
            const flap = document.getElementById('flap');
            const hint = document.getElementById('hint');
            const card = document.getElementById('giftCard');
            let isOpened = false;

            envelope.addEventListener('click', () => {
                if (isOpened) return;
                isOpened = true;

                hint.style.opacity = '0';
                flap.style.transform = 'rotateX(180deg)';
                
                setTimeout(() => {
                    envelope.style.opacity = '0';
                    setTimeout(() => {
                        envelope.style.display = 'none';
                        card.classList.add('revealed');
                        createGoldDust(); // Llama a la explosión de oro
                    }, 400); 
                }, 500); 
            });

            // 4. MAGIA: PARTÍCULAS DE POLVO DE ORO
            function createGoldDust() {
                const scene = document.getElementById('scene');
                const colors = ['#d4af37', '#f9df9f', '#ffffff'];
                
                for(let i = 0; i < 40; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    
                    const size = Math.random() * 4 + 2;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                    
                    particle.style.left = '50%';
                    particle.style.top = '50%';
                    scene.appendChild(particle);
                    
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 60 + Math.random() * 120;
                    const tx = Math.cos(angle) * velocity;
                    const ty = Math.sin(angle) * velocity - 30;
                    
                    particle.animate([
                        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                        { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                    ], {
                        duration: 1000 + Math.random() * 1000,
                        easing: 'cubic-bezier(0, 0.9, 0.5, 1)'
                    }).onfinish = () => particle.remove();
                }
            }
        });
    </script>
</body>
</html>
